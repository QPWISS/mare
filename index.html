<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اتصل نصل - مارع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f3f8f5;--card:#fff;--ink:#1e2b25;--mut:#6a7b73;--pri:#2f7d66;--pi:#fff;
  --acc:#f4a259;--line:#e0eae4;--bad:#c0453a;
  --sh:0 1px 2px rgba(30,60,45,.06),0 4px 14px rgba(30,60,45,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark) and (min-width:99999px){
  :root:not([data-theme="light"]){--bg:#0b171a;--card:#13262b;--ink:#e8f1f3;--mut:#93a9af;--pri:#3fb6c9;--pi:#04181c;--acc:#ff8a3a;--line:#22393f;--bad:#ff8a80;--sh:none}
}
:root[data-theme="dark"]{--bg:#0b171a;--card:#13262b;--ink:#e8f1f3;--mut:#93a9af;--pri:#3fb6c9;--pi:#04181c;--acc:#ff8a3a;--line:#22393f;--bad:#ff8a80;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:0 14px 150px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
h1{font-size:21px;font-weight:800;margin:0;color:var(--pri);line-height:1.1}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;font-size:15px;font-weight:700;border:0;border-radius:10px;padding:8px 14px;background:var(--pri);color:var(--pi);cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.acc,.btn.acc{background:var(--acc);color:#3b2410}
button.sm,.btn.sm{font-size:14px;padding:5px 11px}
button.big,.btn.big{font-size:16px;padding:12px 16px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 8px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px}
.tabs button{flex:1;border:0;box-shadow:var(--sh);padding:10px 12px;background:var(--card);color:var(--ink);white-space:nowrap}
.tabs button.on{background:var(--pri);color:var(--pi)}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc);color:#3b2410}
.tag.ok{background:var(--pri);color:#fff}
.tag.off{background:var(--line);color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;padding:0;font-size:20px;line-height:1}
.qty b{min-width:18px;text-align:center}
.bar{position:fixed;inset:auto 0 calc(64px + env(safe-area-inset-bottom,0px)) 0;margin:0 10px;padding:10px 14px;background:var(--pri);color:var(--pi);display:flex;justify-content:space-between;align-items:center;border-radius:16px;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.bar button{background:var(--acc);color:#3b2410}
.alert{background:var(--acc);color:#3b2410;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.store{border-inline-start:4px solid var(--pri);padding-inline-start:8px;margin:6px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.logo{display:flex;align-items:center;gap:10px}
.lgm{height:48px;width:48px;object-fit:contain;border-radius:13px}
.lgf{width:min(240px,66%);display:block;margin:0 auto}
.sub{font-size:13px;color:var(--mut);font-weight:700}
.who{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap;justify-content:flex-end}
.who small{color:var(--mut)}
.auth{text-align:center;padding:30px 0 10px}
.hero{background:#fdf0e1;color:#4a3318;padding:12px 14px;border-radius:14px;margin:10px 0;display:flex;flex-direction:column;gap:4px}
.hero b{font-size:16px}
.hero span{opacity:.85;font-size:14px}
.steps{display:flex;gap:4px;margin:8px 0}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.d{background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.card.st-new{border-inline-start:5px solid var(--acc)}
.card.st-delivered{opacity:.75}
.card.late{border-inline-start:5px solid var(--bad)}
.nav{position:fixed;inset:auto 0 0 0;z-index:10;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:21px;line-height:1.3;padding:4px 6px;border-radius:12px}
.nav button small{font-size:12px;font-weight:700}
.nav button.on{color:var(--pri);background:var(--bg)}
.deliv{font-size:14px;color:var(--mut);margin:2px 0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.cat span{font-size:34px;line-height:1.2}
.scard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:16px;padding:12px;margin:8px 0;text-align:start;font-weight:400}
.scard.big{display:block;padding:0;overflow:hidden;margin:10px 0}
.simg{position:relative;aspect-ratio:16/8;background:var(--card);display:grid;place-items:center;font-size:44px}
.simg img{width:100%;height:100%;object-fit:cover;display:block}
.simg.noimg{background:#e4efe9}
.simg em{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:18px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:16px}
.sbar{margin:4px 0 6px;background:var(--card);box-shadow:var(--sh);border:0;border-radius:14px}
.chips{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:var(--ink);font-size:12px;font-weight:700;padding:0;width:72px;line-height:1.3}
.chip span{width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:28px}
.pghead{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;background:var(--bg);padding:10px 0;font-size:18px}
.pghead b{flex:1}
.cover{height:auto;aspect-ratio:16/10;max-height:360px;border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:64px;margin:4px 0 10px}
.cover img{width:100%;height:100%;object-fit:cover}
.cover.noimg{aspect-ratio:auto;height:130px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px}
.info.two{grid-template-columns:1fr 1fr}
.info small{display:block;color:var(--mut);font-size:12px}
.gtabs{position:sticky;top:54px;background:var(--bg);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;border-bottom:1px solid var(--line)}
.gtabs button{background:none;color:var(--mut);padding:8px 14px;border-radius:0}
.gtabs button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.prow{padding:12px 0;border-top:1px solid var(--line)}
.pimg{width:68px;height:68px;border-radius:12px;object-fit:cover;margin-inline-end:10px}
.av{width:38px;height:38px;border-radius:12px;background:var(--pri);color:var(--pi);display:grid;place-items:center;font-weight:800}
.av.big{width:52px;height:52px;border-radius:16px;font-size:28px;background:var(--bg)}
.empty{text-align:center;padding:36px 16px}
.empty span{font-size:48px;display:block}
.empty b{display:block;font-size:18px;margin:6px 0}
.wacard{text-align:center;padding:22px 16px}
.wacard p{margin:6px 0 16px}
.secbtn{display:flex;justify-content:space-between;align-items:center;color:var(--ink);text-decoration:none;font-size:16px}
.tot{font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.mapov{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-size:17px}
.mnote{padding:0 14px 8px;font-size:14px;color:var(--mut)}
.mapwrap{position:relative;flex:1}
#mapbox{position:absolute;inset:0}
.mpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:38px;pointer-events:none;z-index:1000}
.mf{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.mf button{flex:1}
.lnk{color:var(--pri);font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const SB_URL = 'https://wzlgdnzhspbuddutgfaj.supabase.co';
const SB_KEY = 'sb_publishable_YwpU-vCZe8PvQ_3DtZNU9Q_K3nxd9I1';
const sb = supabase.createClient(SB_URL, SB_KEY);

const CUR = '₺';
const STATUS = {new:'جديد',accepted:'قيد التجهيز',assigned:'تم تعيين سائق',picked:'مع السائق في الطريق',delivered:'تم التسليم',cancelled:'تم إلغاء الطلب'};
const CUST_STATUS = {new:'تم إرسال الطلب',accepted:'قيد التجهيز',assigned:'قيد التجهيز',picked:'قيد التجهيز',delivered:'تم التسليم✅',cancelled:'تم إلغاء الطلب'};
const NEXT = {assigned:['picked','استلمت الطلب'],accepted:['picked','استلمت الطلب'],picked:['delivered','سلّمت للزبون']};
const CST = ['new','processing','delivered'];
const dname = id => (db.users.find(u => u.id === id) || {}).name || '';
const dphone = id => (db.users.find(u => u.id === id) || {}).phone || '';
const CATS = [
  ['supermarket','ماركت','🛒'],
  ['veg','خضار وفواكه','🥬'],
  ['pharmacy','صيدليات','💊'],
  ['food','مطاعم','🍔'],
  ['electric','أدوات كهربائية','🔌'],
  ['meat','ملاحم ودواجن','🥩'],
  ['sweets','حلويات ومعجنات','🍰'],
  ['gas','غاز ومحروقات','⛽'],
  ['offices','مكتبات وقرطاسية','📚']
];

const catI = c => CATS.find(x => x[0] === c) || CATS[0];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm = n => Number(n).toLocaleString('en-US') + ' ' + CUR;
const nph = p => { p = String(p).replace(/\D/g, ''); if(p.startsWith('00')) p = p.slice(2); if(p.startsWith('963')) p = '0' + p.slice(3); return p; };
const intl = p => { p = String(p).replace(/\D/g, ''); return p[0] === '0' ? '963' + p.slice(1) : p; };
const e164 = p => '+' + intl(nph(p));
const wa = (p, t) => 'https://wa.me/' + (p ? intl(p) : '') + '?text=' + encodeURIComponent(t);

let db = { fee: 2000, notes: [], orders: [], stores: [], users: [], banner: { t: 'اتصل نصل - مارع', s: '' }, invites: [], secs: [], wa: '' };
let me = null, tab = 'home', cart = {}, mode = 'login', last = '', loc = null, place = '', cat = null, sid = null, grp0 = null, q = '';
let prev = {}, authBusy = false, shift = false, wl = null, mp_ = null, ccid = null, cprof = null, rp = 'unsettled';
const ack = new Set((() => { try { return JSON.parse(localStorage.getItem('maraa_ack') || '[]'); } catch(e) { return []; } })());

let audioCtx = null;
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = 880;
    g.gain.value = 0.2;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.2);
  } catch(e) { console.warn(e); }
}

const sub = o => o.items.reduce((a, i) => a + i.price * i.q, 0);
const grp = o => { const g = {}; o.items.forEach(i => (g[i.sid] = g[i.sid] || []).push(i)); return g; };
const sname = id => (db.stores.find(s => s.id === id) || { name: '؟' }).name;
const sphone = id => (db.stores.find(s => s.id === id) || {}).phone || '';
const note = t => { db.notes.push({ id: Date.now() + Math.random(), t, seen: false }); };

const fail = e => { console.error(e); const msg = (e && (e.message || e.details || e.hint)) || ''; alert(msg ? ('تنبيه: ' + msg) : 'تعذّر تنفيذ العملية. تحقق من اتصال الإنترنت وحاول مرة أخرى.'); };
const act = async p => { const r = await p; if (r.error) { fail(r.error); return false; } await pull(); render(); return true; };

async function pull() {
  if (!me) return;
  try {
    const queries = [
      sb.from('stores').select('*').order('created_at'),
      sb.from('products').select('*').order('created_at'),
      sb.from('settings').select('*').eq('id', 1).maybeSingle(),
      sb.from('orders').select('*').order('id', { ascending: false }).limit(200),
      sb.from('sections').select('*').order('created_at').then(x => x.error ? { data: [] } : x),
      sb.from('profiles').select('id, name, phone, role').in('role', ['driver', 'admin']).then(x => x.error ? { data: [] } : x)
    ];
    if (me.role === 'admin') {
      queries.push(sb.from('driver_invites').select('*').then(x => x.error ? { data: [] } : x));
    }
    const r = await Promise.all(queries);
    const bad = r.find(x => x.error); if (bad) throw bad.error;
    const [s, p, st, o, sc, d, iv] = r;

    const stores = s.data.map(x => ({
      id: x.id, name: x.name, cat: x.cat, phone: x.phone, eta: x.eta, open: x.is_open, image_url: x.image_url,
      products: p.data.filter(y => y.store_id === x.id).map(y => ({ id: y.id, name: y.name, price: +y.price, g: y.grp, on: y.available, image_url: y.image_url }))
    }));

    const orders = o.data.map(x => ({
      id: x.id, cust: x.customer_phone, cid: x.customer_id, settled: !!x.settled, custName: x.customer_name,
      place: x.place, loc: x.lat != null ? { lat: +x.lat, lng: +x.lng } : null,
      items: x.items.map(i => ({ ...i, price: +i.price })), fee: +x.fee, status: x.status,
      driver: x.driver_id, t: new Date(x.created_at).getTime()
    })).reverse();

    const users = d ? d.data.map(u => ({ id: u.id, name: u.name, phone: u.phone, role: u.role })) : [];

    if (me.role === 'admin') {
      orders.forEach(x => {
        const b = prev[x.id];
        if (b && b !== x.status && ['picked', 'delivered'].includes(x.status)) {
          note((users.find(u => u.id === x.driver) || {}).name + ': ' + (x.status === 'picked' ? 'استلم الطلب' : 'سلّم الطلب') + ' (طلب #' + x.id + ')');
        }
      });
    }
    prev = Object.fromEntries(orders.map(x => [x.id, x.status]));
    Object.keys(cart).forEach(k => { if (!stores.some(z => z.products.some(y => y.id === k))) delete cart[k]; });

    const nd = {
      fee: st.data ? +st.data.fee : 2000,
      banner: { t: (st.data && st.data.banner_t) || 'اتصل نصل - مارع', s: (st.data && st.data.banner_s) || '' },
      stores, orders, users, invites: iv ? iv.data : [], secs: sc.data || [],
      wa: (st.data && st.data.admin_whatsapp) || '', notes: db.notes
    };
    const sig = JSON.stringify(nd);
    if (sig !== last) {
      db = nd;
      const a = document.activeElement;
      if (!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) {
        last = sig;
        render();
      }
    }
  } catch(e) { console.error(e); }
}

function setTab(t) { tab = t; render(); }
function head() {
  const r = { customer: 'زبون', admin: 'مدير', driver: 'سائق' }[me.role];
  return `<header class="top"><div class="logo"><img class="lgm" src="logo-mark.webp" alt="اتصل نصل"><div><h1>اتصل نصل</h1><div class="sub">${me.role==='customer'?'التوصيل ضمن مارع':'مارع'}</div></div></div>${me.role==='customer'?'':`<div class="who"><span>${esc(me.name)}</span><small>${r}</small><button class="alt sm" onclick="logout()">خروج</button></div>`}</header>`;
}

async function logout() {
  await sb.auth.signOut();
  me = null; cart = {}; loc = null; closeMap(); tab = 'home'; last = ''; render();
}

function authView() {
  const reg = mode === 'reg';
  return `<div class="auth"><img class="lgf" src="logo.webp" alt="اتصل نصل - مارع" style="border-radius:24px;margin-bottom:10px"><div class="sub" style="font-size:18px;font-weight:800;color:var(--pri);margin-bottom:4px">اتصل نصل - مارع</div><div class="sub">نوصل طلبك إلى باب بيتك</div></div>
<div class="card"><div class="tabs"><button class="${reg?'':'on'}" onclick="mode='login';render()">دخول</button><button class="${reg?'on':''}" onclick="mode='reg';render()">حساب جديد</button></div>
<label>رقم الواتساب</label><input id="ph" type="tel" inputmode="tel" placeholder="09xxxxxxxx">
${reg?'<label>الاسم</label><input id="nm">':''}
<label>كلمة السر</label><input id="pw" type="password" placeholder="6 أحرف أو أرقام على الأقل">
<button onclick="auth()" style="width:100%">${reg?'إنشاء الحساب':'دخول'}</button><div id="err" class="mut" style="color:var(--bad);margin-top:6px"></div></div>`;
}

async function auth() {
  const e = $('err'), ph = nph($('ph').value), pw = $('pw').value;
  if (!/^\d{9,15}$/.test(ph)) return e.textContent = 'أدخل رقم واتساب صحيحاً';
  if (pw.length < 6) return e.textContent = 'كلمة السر 6 أحرف أو أرقام على الأقل';
  if (authBusy) return;
  authBusy = true; e.textContent = 'جارٍ التحقق...';
  try {
    let r;
    if (mode === 'reg') {
      const nm = $('nm').value.trim();
      if (!nm) return e.textContent = 'أدخل اسمك';
      r = await sb.auth.signUp({ phone: e164(ph), password: pw, options: { data: { phone: ph, name: nm } } });
      if (r.error) return e.textContent = /registered|exists/i.test(r.error.message) ? 'هذا الرقم مسجّل مسبقاً، يرجى تسجيل الدخول' : 'تعذّر إنشاء الحساب (' + r.error.message + ')';
      if (!r.data.session) return e.textContent = 'لم يكتمل التسجيل، يرجى المحاولة لاحقاً';
    } else {
      r = await sb.auth.signInWithPassword({ phone: e164(ph), password: pw });
      if (r.error) return e.textContent = 'الرقم أو كلمة السر غير صحيحة';
    }
    await enter(r.data.user);
  } catch(x) {
    console.error(x); e.textContent = 'تعذّر الاتصال، حاول مرة أخرى';
  } finally {
    authBusy = false;
  }
}

async function enter(u) {
  const r = await sb.from('profiles').select('*').eq('id', u.id).single();
  if (r.error) throw r.error;
  me = { id: r.data.id, phone: r.data.phone, name: r.data.name, role: r.data.role };
  tab = me.role === 'admin' ? 'orders' : me.role === 'driver' ? 'jobs' : 'home';
  last = '';
  loc = (r.data.lat != null && r.data.lng != null) ? { lat: +r.data.lat, lng: +r.data.lng } : null;
  await pull();
  render();

function find(pid) {
  for (const s of db.stores) {
    const p = s.products.find(p => p.id === pid);
    if (p) return { s, p };

}

function qd(pid, d) {
  cart[pid] = Math.max(0, (cart[pid] || 0) + d);
  if (!cart[pid]) delete cart[pid];
  render();
}

const cartSum = () => Object.entries(cart).reduce((a, [id, q]) => { const f = find(id); return a + (f ? f.p.price * q : 0); }, 0);

async function send() {
  if (!loc) return openMap(true);
  const items = Object.entries(cart).map(([pid, q]) => ({ pid, q }));
  if (!items.length) return;
  const payload = {
    customer_id: me.id,
    customer_name: me.name,
    customer_phone: me.phone,
    place: place.trim(),
    lat: loc ? loc.lat : null,
    lng: loc ? loc.lng : null,
    items
  };
  const r = await sb.from('orders').insert(payload);
  if (r.error) {
    // If table doesn't accept customer_name/customer_phone explicitly, fallback to default insert
    const r2 = await sb.from('orders').insert({ place: place.trim(), lat: loc ? loc.lat : null, lng: loc ? loc.lng : null, items });
    if (r2.error) return fail(r2.error);
  }
  cart = {}; place = ''; tab = 'mine'; await pull(); render();
}

function mapGPS(q) {

  navigator.geolocation.getCurrentPosition(p => { if (mp_) mp_.setView([p.coords.latitude, p.coords.longitude], 18); }, () => { if (!q) alert('تعذّر تحديد موقعك. فعّل الموقع في الجوال أو حرّك الخريطة يدوياً.'); }, { enableHighAccuracy: true, timeout: 15000 });
}
function closeMap() { if (mp_) { mp_.remove(); mp_ = null; } const d = document.getElementById('mapov'); if (d) d.remove(); }
async function saveLoc() {

async function adv(id, btn) {
  const o = db.orders.find(o => o.id == id);
  if (!o) return;
  const n = NEXT[o.status];
  if (!n) return;
  const nextStatus = n[0];
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التحديث...'; }
  
  // 1. Try direct update
  let r = await sb.from('orders').update({ status: nextStatus }).eq('id', id);
  
  // 2. If blocked by RLS, try fallback RPCs
  if (r.error) {
    const rpc1 = await sb.rpc('driver_advance_order', { p_id: id, p_status: nextStatus });
    if (!rpc1.error) r = rpc1;
    else {
      const rpc2 = await sb.rpc('advance_order', { p_id: id, p_status: nextStatus });
      if (!rpc2.error) r = rpc2;
    }
  }

  if (r.error) {
    console.error('adv error:', r.error);
    alert('تعذّر تحديث الحالة: ' + (r.error.message || 'تحقق من صلاحيات RLS في Supabase'));
    if (btn) { btn.disabled = false; btn.textContent = n[1]; }
    return;
  }

  // Optimistic update
  o.status = nextStatus;
  render();
  await pull();
}

async function upImg(file, mx = 640) {
  const b = await createImageBitmap(file), k = Math.min(1, mx / Math.max(b.width, b.height)), c = document.createElement('canvas');
  c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
  c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', .8)), path = Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.webp';
  const r = await sb.storage.from('images').upload(path, blob, { contentType: 'image/webp' });
  if (r.error) throw r.error;
  return sb.storage.from('images').getPublicUrl(path).data.publicUrl;
}

    const g = grp(o), n = NEXT[o.status], fresh = o.status === 'assigned' && !ack.has(o.id);
    return `<div class="card${fresh?' st-new':''}">${fresh?`<div class="alert row"><span>🔔 طلب جديد معيّن لك</span><button class="sm" onclick="ackOrd(${o.id})">علمت</button></div>`:''}<div class="row"><b>طلب #${o.id}</b><span class="tag">${STATUS[o.status]}</span></div>
${Object.entries(g).map(([sid,it])=>`<div class="store"><b>${esc(sname(sid))}</b><div class="mut">${it.map(i=>esc(i.name)+' × '+i.q).join('، ')}</div>المبلغ المطلوب دفعه للمحل: <b>${fm(it.reduce((a,i)=>a+i.price*i.q,0))}</b></div>`).join('')}
<div class="row"><span>المبلغ المطلوب تحصيله من الزبون</span><b>${fm(sub(o)+o.fee)}</b></div><div class="mut">${esc(o.custName)}${o.place?' · '+esc(o.place):''}</div>
<div class="row" style="margin-top:8px">${o.loc?`<a class="btn sm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${o.loc.lat},${o.loc.lng}">📍 اتجاهات</a>`:''}<a class="btn alt sm" href="tel:${esc(o.cust)}">اتصال</a><a class="btn alt sm" target="_blank" rel="noopener" href="${wa(o.cust,'مرحباً، أنا سائق اتصل نصل - مارع بخصوص طلبك #'+o.id)}">واتساب</a></div>
${n?`<button class="acc" style="width:100%;margin-top:8px" onclick="adv(${o.id}, this)">${n[1]}</button>`:''}</div>`;
  }).join('') || '<div class="card mut">لا توجد طلبات معيّنة لك الآن.</div>';

  return head + '<h2>طلباتي الحالية</h2>' + cards + `<h2>ملخص اليوم</h2><div class="card"><div class="row"><span>طلبات مُسلَّمة</span><b>${done.length}</b></div><div class="row"><span>المحصّل من الزبائن</span><b>${fm(col)}</b></div><div class="row"><span>المدفوع للمتاجر</span><b>${fm(pay)}</b></div><div class="row tot"><b>رسوم التوصيل</b><b>${fm(col-pay)}</b></div></div>`
    + (done.length ? '<h2>طلبات اليوم المُسلَّمة</h2>' + done.slice().reverse().map(o => `<div class="card row"><span>طلب #${o.id} · ${new Date(o.t).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})}</span><b>${fm(sub(o)+o.fee)}</b></div>`).join('') : '');
}

async function startShift() {
  shift = true;
  beep();
  try { if (navigator.wakeLock) wl = await navigator.wakeLock.request('screen'); } catch(e) {}
  render();
}
function endShift() {
  shift = false;
  try { wl && wl.release(); } catch(e) {}
  wl = null;
  render();
}
document.addEventListener('visibilitychange', async () => {
  if (shift && document.visibilityState === 'visible' && navigator.wakeLock) {
    try { wl = await navigator.wakeLock.request('screen'); } catch(e) {}
  }
});
function ackOrd(id) {
  ack.add(id);
  try { localStorage.setItem('maraa_ack', JSON.stringify([...ack])); } catch(e) {}
  render();
}

setInterval(() => {
  if (me && me.role === 'driver' && shift && db.orders.some(o => o.driver === me.id && o.status === 'assigned' && !ack.has(o.id))) {
    beep();
    try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(e) {}
  }
}, 3500);

function render() {
  $('app').innerHTML = !me ? authView() : head() + ({ customer: custView, admin: adminPage, driver: driverView }[me.role])();
}

(async () => {
  render();
  try {
    const r = await sb.auth.getSession();
    if (r.data.session) await enter(r.data.session.user);
  } catch(e) { console.error(e); }
  setInterval(pull, 60000);
  sb.channel('orders-live').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => pull()).subscribe();
})();
</script>
