<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اتصل نصل - مارع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#F5F5DC;--card:#fff;--ink:#003366;--mut:#333333;--pri:#003366;--pi:#fff;--acc:#3399FF;--acc-d:#1f7fe0;--line:#e4e0c4;--bad:#c0392b;--sh:0 2px 10px rgba(0,51,102,.08)}
html,body{background:#e9e7c9;font-family:'Cairo',Tahoma,sans-serif;color:var(--ink);margin:0;box-sizing:border-box}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 14px 120px;box-shadow:0 0 40px rgba(0,0,0,.08)}
*{box-sizing:border-box}
header.top{background:var(--pri);color:#fff;margin:0 -14px 14px;padding:20px 16px 16px;border-radius:0 0 26px 26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
header.top h1{color:#fff;font-size:20px;margin:0}
header.top .sub{color:#d3ebeb;font-size:12px}
.logo{display:flex;align-items:center;gap:10px}
.lgm{height:48px;width:48px;object-fit:contain;border-radius:13px}
.ban{width:min(340px,92%);display:block;margin:0 auto;border-radius:24px;box-shadow:var(--sh)}
.auth{padding:14px 0 6px;text-align:center}
.card{background:var(--card);border:1px solid #efecd2;border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:var(--acc);color:#002244;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 4px 12px rgba(51,153,255,.3)}
button.alt,.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri);box-shadow:none}
button.acc,.btn.acc,.bar button{background:var(--acc);color:#002244}
button.sm,.btn.sm{font-size:14px;padding:5px 11px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);margin:4px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);flex:1}
.tabs button.on{background:var(--pri);color:#fff}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:#dcecff;color:#003366}
.tag.ok{background:var(--pri);color:#fff}
.tag.off{background:#ece9d2;color:#333}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;z-index:10;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:6px;border-radius:22px 22px 0 0;box-shadow:0 -6px 22px rgba(0,51,102,.14)}
.nav button{flex:1;background:none;color:#3f525c;display:flex;flex-direction:column;align-items:center;font-size:22px;padding:4px;border-radius:12px;box-shadow:none}
.nav button small{font-size:12px;font-weight:800}
.nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc)}
.bar{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;padding:10px 14px;background:var(--pri);color:#fff;display:flex;justify-content:space-between;align-items:center;border-radius:16px;z-index:9}
.bar button{background:var(--acc);color:#002244}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ctile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;border-radius:20px;color:var(--ink);font-size:13px;font-weight:700;min-height:98px;text-align:center;background:#fff;box-shadow:var(--sh)}
.ctile span{font-size:38px}
.scard{display:block;width:100%;background:#fff;border-radius:20px;overflow:hidden;box-shadow:var(--sh);margin:10px 0;text-align:start;border:0;padding:0;cursor:pointer}
.simg{aspect-ratio:16/9;position:relative;background:#cfd8dc}
.simg img{width:100%;height:100%;object-fit:cover}
.simg.noimg{background:linear-gradient(135deg,#003366,#1b5f9e);color:rgba(255,255,255,.22);font-size:84px;display:grid;place-items:center}
.sov{position:absolute;inset:auto 0 0 0;padding:34px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.74));color:#fff}
.sov b{font-size:18px;display:block}
.stg{display:inline-block;background:rgba(255,255,255,.9);color:var(--pri);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin:4px 0}
.hero{background:#dcecff;color:#003366;padding:12px 14px;border-radius:14px;margin:10px 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pc{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:10px;display:flex;flex-direction:column;gap:5px;text-align:center}
.pci{aspect-ratio:1;border-radius:12px;background:#eaf1f4;display:grid;place-items:center;font-size:40px;overflow:hidden;position:relative}
.pci img{width:100%;height:100%;object-fit:cover}
.pp{color:#333;font-weight:800}
.qty{display:flex;align-items:center;gap:10px;justify-content:center}
.qty button{background:var(--pri);color:#fff;border:2px solid var(--acc);border-radius:10px;width:34px;height:34px;padding:0;font-size:20px}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kp{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.kp span{font-size:22px;display:block}.kp b{font-size:17px;display:block;color:var(--pri)}.kp small{font-size:11px;color:#333}
.kp.kw{background:#eaf3ff}.kp.kb{background:#fbe3df}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.wc{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}
.wc span{font-size:22px}.wc small{display:block;color:#333;font-size:12px}.wc b{font-size:19px;color:var(--pri)}
.wc.hl{background:var(--pri)}.wc.hl b,.wc.hl small{color:#fff}
.mgrid{display:grid;gap:10px}
.mitem{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:start;width:100%;font-weight:400}
.mitem span{font-size:28px}.mitem small{display:block;color:#333}
.mapov{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.mapwrap{position:relative;flex:1}
#mapbox{position:absolute;inset:0}
.mpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:38px;pointer-events:none;z-index:1000}
.mf{display:flex;gap:10px;padding:12px 14px}
.mf button{flex:1}
.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:16px;max-height:92vh;overflow:auto}
</style>

const BANNER='data:image/webp;base64,UklGRj4JAQBXRUJQVlA4IDIJAQDQ4gOdASrQAtACPnk2lkgkoqUlp5QMaLAPCWJu3MzmDy2yB8igWl/euxEVGWnT4F9FOCc4PU/l1/sf4/9a+7LjH3j+//y37of5f3uOO+6b3v9+/0X/O/yX7h/dT/U8EfiP+l5rHrn81/4v81+Y3y9/4v/n/3/uz/U3/X/O36Cv59/e/+F/e/9t+x30r/7X7ie+T/Ef+D/z/sb8E/6r/nf2Z96D/j//D/X+97/Df9X8wPkJ/uX+e/+Hr2ezB+9P//9x/+of8L/6e0d/5/3X/6/y3/2v/rfuR/4Peq//f+x/7HwAf//22v4B//+LI/y/939ZPyL+b/2f+O/c3/I+pP5H9r/uf8X/pv+vzp+zvM/+cfoL+X/jv3l9wP/F/r/JX87/n//P6h35F/V/9V/gP3k/wfx0d3/2V8vPef+f6EHuF9x/6f+M/0f7bfF39V/2/T797/3v/p+4T7BP2B/6vtN/0fGH/Mf9j9s/gK/nX+G/aj2YP/r/e+kv9E/2P/1/2XwKfzj++/s12vP29///u7/vQfxgjAI9jx2KtaJb5b4qh/QgIH2pNC80uqicUPXy72nikBA9tyxlBK0IZEknwC02TP4HGFgtVc5mjrjf/5v/////9K9yAIgRL1AWlQugOypri5/gLFD//8Cdhc950kf/KVkFKqaZ1RrTUzt3qoiReaWqIQeJ/lE////ss/t10xkAzUgOwKgOA9XtGDSDxBbFFxjvck21v1W2xRe70RZF2Hq8ohmHvJOqR1kCQY6XPfA4wi8DQ/Wav7N8kcIFt8H/+XidZ4hEa2HMG3MwP18bUd6a7oJA84Kwghbu3cgw/+5AseUcSF6Qeu/rVsD618GvX8/sBZw8/uwHxYgXgAcX6sOWPT4kKe+TayZhJf39flXpD4U/PRbide4rTNSSvWEKUp//cHJvWtaX/v6v8doCv//Qf/lQulArih8ozqdfyDNgqKsZgbmPpyQqyhFOA1BvLbQBS4D+MJu766NPf4x76wP2GrgI/8vCVXHgf...';
const SB_URL='https://wzlgdnzhspbuddutgfaj.supabase.co',SB_KEY='sb_publishable_YwpU-vCZe8PvQ_3DtZNU9Q_K3nxd9I1';
const sb=supabase.createClient(SB_URL,SB_KEY);
const nph=p=>{p=String(p).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('963'))p='0'+p.slice(3);return p};
const e164=p=>'+'+intl(nph(p));
const intl=p=>{p=String(p).replace(/\D/g,'');return p[0]==='0'?'963'+p.slice(1):p};
const wa=(p,t)=>'https://wa.me/'+(p?intl(p):'')+'?text='+encodeURIComponent(t);

let db={fee:2000,notes:[],orders:[],stores:[],users:[],banner:{t:'اتصل نصل - مارع',s:''},cur:'TRY',rates:{USD:0.03,SYP:13000}};
let me=null,tab='home',cart={},mode='login',loc=null,place='',cat=null,sid=null,grp0=null,q='',sq2='';
let dbr=false,cmode=false,cpn=null,tkf='open',oid=null,odrv=null,pfid=null,pfp=null,pfd=0,ogs='الكل',ocur=null,stab='prod';

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','gt;':'>','"':'&quot;'}[c]));
const fm=n=>{const c=db.cur||'TRY',r=db.rates||{},v=+n;
 if(c==='USD'&&+r.USD>0)return '$'+(v*r.USD).toLocaleString('en-US',{maximumFractionDigits:2});
 if(c==='SYP'&&+r.SYP>0)return (Math.round(v*r.SYP/100)*100).toLocaleString('en-US')+' ل.س';
 return v.toLocaleString('en-US',{maximumFractionDigits:2})+' ₺'};

const CATS=[['supermarket','ماركت','🛒'],['veg','خضار وفواكه','🥬'],['pharmacy','صيدليات','💊'],['meat','ملاحم ودواجن','🥩'],['electric','أدوات كهربائية','🔌'],['food','مطاعم','🍔'],['offices','مكتبات وقرطاسية','📚'],['gas','غاز ومحروقات','⛽'],['sweets','حلويات ومعجنات','🍰']];
const catI=c=>CATS.find(x=>x[0]===c)||CATS[0];
const sub=o=>o.items.reduce((a,i)=>a+i.price*i.q,0);
const oTot=o=>sub(o)+o.fee-(o.disc||0);
const grp=o=>{const g={};o.items.forEach(i=>(g[i.sid]=g[i.sid]||[]).push(i));return g};
const sname=id=>(db.stores.find(s=>s.id===id)||{name:'؟'}).name;
const sphone=id=>(db.stores.find(s=>s.id===id)||{}).phone||'';
const fail=e=>{console.error(e);alert(e?.message||'حدث خطأ غير متوقع')};

async function pull(){
 try{
  const [s,p,st,o,sc,d,iv,gr,mg,tx,cp,ld,sl]=await Promise.all([
   sb.from('stores').select('*').order('created_at'),
   sb.from('products').select('*').order('created_at'),
   sb.from('settings').select('*').eq('id',1).maybeSingle(),
   sb.from('orders').select('*').order('id',{ascending:false}).limit(200),
   sb.from('sections').select('*').order('created_at'),
   sb.from('profiles').select('*'),
   sb.from('driver_invites').select('*'),
   sb.from('store_groups').select('*').order('pos'),
   sb.from('store_managers').select('*'),
   sb.from('tickets').select('*').order('created_at',{ascending:false}).limit(100),
   sb.from('coupons').select('*').order('created_at',{ascending:false}),
   sb.from('driver_ledger').select('*').order('created_at',{ascending:false}).limit(500),
   sb.from('driver_settlements').select('*').order('created_at',{ascending:false}).limit(50)
  ]);
  db.stores=s.data.map(x=>({id:x.id,name:x.name,cat:x.cat,phone:x.phone,eta:x.eta,open:x.is_open,man:x.is_open,offer:x.offer_text,image_url:x.image_url,products:p.data.filter(y=>y.store_id===x.id).map(y=>({id:y.id,name:y.name,price:+y.price,g:y.grp,on:y.available,descr:y.descr,old:y.old_price!=null?+y.old_price:null,image_url:y.image_url}))}));
  db.orders=o.data.map(x=>({id:x.id,cust:x.customer_phone,cid:x.customer_id,settled:!!x.settled,disc:+x.discount||0,code:x.coupon_code,custName:x.customer_name,place:x.place,loc:x.lat!=null?{lat:+x.lat,lng:+x.lng}:null,items:x.items.map(i=>({...i,price:+i.price})),fee:+x.fee,status:x.status,driver:x.driver_id,t:new Date(x.created_at).getTime()})).reverse();
  db.users=d.data.map(u=>({id:u.id,name:u.name,phone:u.phone,role:u.role,shift:u.on_shift,sup:u.is_super,blocked:u.blocked}));
  db.fee=st.data?+st.data.fee:2000;
  db.banner={t:st.data?.banner_t||'اتصل نصل - مارع',s:st.data?.banner_s||''};
  db.cur=st.data?.currency||'TRY';
  db.rates=st.data?.rates||{USD:0.03,SYP:13000};
  db.invites=iv.data; db.secs=sc.data; db.grps=gr.data; db.mgrs=mg.data; db.tix=tx.data; db.cpns=cp.data; db.led=ld.data; db.sett=sl.data;
  render();
 }catch(e){console.error(e)}
}

async function enter(u){
 const r=await sb.from('profiles').select('*').eq('id',u.id).single();
 if(r.error)throw r.error;
 me={id:r.data.id,phone:r.data.phone,name:r.data.name,role:r.data.role,sup:!!r.data.is_super};
 tab=me.role==='admin'?'orders':me.role==='driver'?'jobs':me.role==='owner'?'oprod':'home';
 await pull();
}

async function auth(){
 const e=$('err'),ph=nph($('ph').value),pw=$('pw').value;
 if(!/^\d{9,15}$/.test(ph))return e.textContent='أدخل رقم واتساب صحيحاً';
 if(pw.length<6)return e.textContent='كلمة السر 6 أحرف على الأقل';
 try{
  let r;
  if(mode==='reg'){
   const nm=$('nm').value.trim();if(!nm)return e.textContent='أدخل اسمك';
   r=await sb.auth.signUp({phone:e164(ph),password:pw,options:{data:{phone:ph,name:nm}}});
   if(r.error)return e.textContent='الرقم مسجّل مسبقاً';
  }else{
   r=await sb.auth.signInWithPassword({phone:e164(ph),password:pw});
   if(r.error)return e.textContent='الرقم أو كلمة السر غير صحيحة';
  }
  await enter(r.data.user);
 }catch(err){e.textContent='حدث خطأ أثناء الاتصال'}
}
function logout(){me=null;cart={};tab='home';render();sb.auth.signOut()}

function authView(){const reg=mode==='reg';
 return `<div class="auth"><img class="ban" src="${BANNER}" alt="اتصل نصل"></div>
 <div class="card"><div class="tabs"><button class="${reg?'':'on'}" onclick="mode='login';render()">دخول</button><button class="${reg?'on':''}" onclick="mode='reg';render()">حساب جديد</button></div>
 <label>رقم الواتساب</label><input id="ph" type="tel" placeholder="09xxxxxxxx">
 ${reg?'<label>الاسم</label><input id="nm">':''}
 <label>كلمة السر</label><input id="pw" type="password" placeholder="••••••">
 <button onclick="auth()" style="width:100%">${reg?'إنشاء الحساب':'دخول'}</button><div id="err" class="mut" style="color:var(--bad);margin-top:6px"></div></div>`;
}

function render(){
 const app=$('app');
 if(!me){app.innerHTML=authView();return;}
 let h=head();
 if(me.role==='admin') h+=adminPage();
 else if(me.role==='driver'&&!dbr) h+=driverView();
 else if(me.role==='owner'&&!cmode) h+=ownerView();
 else h+=custView();
 app.innerHTML=h;
}

function head(){
 const r={customer:'زبون',admin:'مدير',driver:'سائق',owner:'مدير متجر'}[me.role];
 return `<header class="top"><div class="logo"><img class="lgm" src="${LOGO_MARK}"><div><h1>اتصل نصل</h1><div class="sub">${me.sup?'مدير عام':r}</div></div></div><div class="row"><span style="font-size:13px">${esc(me.name)}</span><button class="alt sm" onclick="logout()">خروج</button></div></header>`;
}

/* ================= CUSTOMER & VIEW-ONLY ================= */
const cartCount=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const cartSum=()=>Object.entries(cart).reduce((a,[id,q])=>{const f=find(id);return a+(f?f.p.price*q:0)},0);
function find(pid){for(const s of db.stores){const p=s.products.find(p=>p.id===pid);if(p)return{s,p}}}
function qd(pid,d){cart[pid]=Math.max(0,(cart[pid]||0)+d);if(!cart[pid])delete cart[pid];render()}

function custView(){
 const on=(...k)=>k.includes(tab)?'on':'';
 const t=`<div class="nav"><button class="${on('home','store')}" onclick="cat=null;setTab('home')">🏠<small>الرئيسية</small></button><button class="${on('cart')}" onclick="setTab('cart')">🛒<small>سلّتي${cartCount()?' ('+cartCount()+')':''}</small></button><button class="${on('mine','ord')}" onclick="setTab('mine')">🧾<small>طلباتي</small></button><button class="${on('acct')}" onclick="setTab('acct')">👤<small>حسابي</small></button></div>`;
 let b='';
 if(tab==='home')b=homeView();
 else if(tab==='store')b=storeView();
 else if(tab==='search')b=searchView();
 else if(tab==='cart'){
  if(!cartCount())b=`<div class="card" style="text-align:center;padding:30px"><span>🛒</span><b>سلّتك فارغة</b></div>`;
  else{
   const by={};Object.entries(cart).forEach(([id,q])=>{const f=find(id);if(f)(by[f.s.id]=by[f.s.id]||[]).push([f.p,q])});
   b=`<h2>سلّتي</h2>`+Object.entries(by).map(([sid,l])=>`<div class="card"><b>${esc(sname(sid))}</b>${l.map(([p,q])=>`<div class="row" style="margin:6px 0"><span>${esc(p.name)} × ${q}</span><b>${fm(p.price*q)}</b></div>`).join('')}</div>`).join('')
   +`<div class="card"><button class="alt" style="width:100%" onclick="openMap(false)">${loc?'📍 تعديل موقع التوصيل':'📍 تحديد موقع التوصيل'}</button><input id="place" value="${esc(place)}" oninput="place=this.value" placeholder="تفاصيل العنوان الإضافية"></div>`
   +couponBox()
   +`<div class="card"><div class="row"><span>المجموع الفرعي</span><span>${fm(cartSum())}</span></div><div class="row"><span>رسوم التوصيل</span><span>${fm(db.fee)}</span></div>${cDisc()>0?`<div class="row" style="color:green"><span>خصم</span><span>-${fm(cDisc())}</span></div>`:''}<div class="row" style="font-size:18px;font-weight:bold;margin-top:6px"><span>الكلي</span><span>${fm(cartSum()+db.fee-cDisc())}</span></div></div>`
   +`<button class="acc" style="width:100%;padding:14px" onclick="sendOrder()" ${loc?'':'disabled'}>إتمام الطلب</button>`;
  }
 }
 else if(tab==='mine')b=mineView();
 else if(tab==='acct')b=acctView();
 else if(tab==='ord')b=ordView();
 return (dbr||cmode)?vnav()+b:t+b;
}

function vnav(){return `<div class="nav"><button class="on" onclick="setTab('home')">🏠<small>الرئيسية</small></button><button onclick="exitBrowse()">↩️<small>رجوع</small></button></div>`}
function exitBrowse(){cmode=false;dbr=false;tab=me.role==='driver'?'jobs':'oprod';render()}
function setTab(t){tab=t;render()}

function homeView(){
 if(cat){
  const l=db.stores.filter(s=>s.cat===cat);
  return `<div class="row"><button class="alt sm" onclick="cat=null;render()">← رجوع</button><b>${catI(cat)[1]}</b></div>`+(l.map(storeCard).join('')||'<div class="card mut">لا توجد متاجر هنا بعد.</div>');
 }
 return `<input readonly class="bar" style="position:static;width:100%;margin-bottom:10px;background:#fff;color:var(--ink)" placeholder="🔍 ابحث عن متجر أو منتج" onclick="setTab('search')">
 <div class="cgrid">${CATS.map(c=>`<button class="ctile" onclick="cat='${c[0]}';render()"><span>${c[2]}</span>${c[1]}</button>`).join('')}</div>
 <h2>المتاجر المتاحة</h2>`+(db.stores.map(storeCard).join('')||'<div class="card mut">لا توجد متاجر.</div>');
}

function storeCard(s){
 return `<button class="scard" onclick="sid='${s.id}';tab='store';render()"><div class="simg${s.image_url?'':' noimg'}">${s.image_url?`<img src="${esc(s.image_url)}">`:`<span>${catI(s.cat)[2]}</span>`}<div class="sov"><b>${esc(s.name)}</b><span class="stg">${catI(s.cat)[1]}</span></div></div></button>`;
}

function storeView(){
 const s=db.stores.find(x=>x.id===sid);if(!s)return homeView();
 const gs=[...new Set(s.products.map(p=>p.g||'المنتجات'))],g=gs.includes(grp0)?grp0:gs[0];
 return `<div class="row"><button class="alt sm" onclick="tab='home';render()">← رجوع</button><h2>${esc(s.name)}</h2></div>
 <div class="pgrid">${s.products.filter(p=>p.on&&(p.g||'المنتجات')===g).map(p=>prodRow(p,s.open)).join('')}</div>`;
}

function prodRow(p,open){
 const q=cart[p.id]||0;
 return `<div class="pc"><div class="pci">${p.image_url?`<img src="${esc(p.image_url)}">`:'<span>📦</span>'}</div><b>${esc(p.name)}</b><div class="pp">${fm(p.price)}</div>${!dbr&&open?(q?`<div class="qty"><button onclick="qd('${p.id}',-1)">-</button><b>${q}</b><button onclick="qd('${p.id}',1)">+</button></div>`:`<button class="sm" onclick="qd('${p.id}',1)">أضف</button>`):''}</div>`;
}

function searchView(){
 return `<input id="sq" value="${esc(q)}" oninput="q=this.value;render()" placeholder="ابحث...">`+
 db.stores.filter(s=>s.name.includes(q)).map(storeCard).join('');
}

function couponBox(){
 return cpn?`<div class="card row"><span>🎟️ كود: <b>${esc(cpn.code)}</b></span><button class="alt sm" onclick="cpn=null;render()">إزالة</button></div>`:`<div class="card row"><input id="cp_in" placeholder="كود خصم"><button class="sm" onclick="useCpn()">تطبيق</button></div>`;
}
async function useCpn(){
 const c=($('cp_in').value||'').trim();if(!c)return;
 const r=await sb.rpc('check_coupon',{p_code:c});
 if(r.data?.[0]?.ok){cpn={code:c,...r.data[0]};render();}else alert('الكود غير صالح');
}
function cDisc(){if(!cpn)return 0; const s=cartSum(); return cpn.kind==='percent'?Math.round((s+db.fee)*cpn.value/100):cpn.value}

async function sendOrder(){
 const items=Object.entries(cart).map(([pid,q])=>{const f=find(pid);return f&&{sid:f.s.id,pid,name:f.p.name,price:f.p.price,q}}).filter(Boolean);
 const r=await sb.from('orders').insert({place:place.trim(),lat:loc?.lat,lng:loc?.lng,coupon_code:cpn?.code,items});
 if(r.error)return fail(r.error);
 cart={};cpn=null;tab='mine';pull();
}

function mineView(){
 return `<h2>طلباتي</h2>`+db.orders.filter(o=>o.cust===me.phone).map(o=>`<div class="card" onclick="oid=${o.id};tab='ord';render()"><div class="row"><b>طلب #${o.id}</b><span class="tag">${o.status}</span></div><div>${fm(oTot(o))}</div></div>`).join('');
}

function acctView(){
 return `<div class="card"><b>${esc(me.name)}</b><div class="mut">${esc(me.phone)}</div></div>
 <button class="alt" style="width:100%;margin-bottom:8px" onclick="openTicket()">🛟 الدعم والشكاوى</button>
 ${me.role==='owner'?`<button class="alt" style="width:100%;margin-bottom:8px" onclick="exitBrowse()">🏪 إدارة متجري</button>`:''}
 <button class="alt" style="width:100%;color:var(--bad)" onclick="logout()">خروج</button>`;
}

function ordView(){
 const o=db.orders.find(x=>x.id===oid);
 return `<button class="alt sm" onclick="tab='mine';render()">← رجوع</button><div class="card"><h2>طلب #${o.id}</h2><div>الحالة: ${o.status}</div></div>`;
}

function openMap(){
 const d=document.createElement('div');d.className='mapov';
 d.innerHTML=`<div class="mh"><b>تحديد الموقع</b><button class="alt sm" onclick="this.closest('.mapov').remove()">إغلاق</button></div><div class="mapwrap" id="mapbox"></div><div class="mf"><button class="acc" onclick="loc={lat:36.48,lng:37.04};this.closest('.mapov').remove();render()">تأكيد الموقع</button></div>`;
 document.body.appendChild(d);
 setTimeout(()=>{
  const m=L.map('mapbox').setView([36.48,37.04],15);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
  m.on('moveend',()=>loc=m.getCenter());
 },200);
}

/* ================= DRIVER & WALLET ================= */
function driverView(){
 const mine=db.orders.filter(o=>o.driver===me.id && o.status!=='delivered');
 return `<h2>طلباتي</h2>`+mine.map(o=>`<div class="card"><b>طلب #${o.id}</b><div>${o.status}</div><button class="acc" onclick="adv(${o.id})">تحديث</button></div>`).join('')+
 `<h2>المحفظة والسجل المالي</h2>`+walletHTML()+
 `<button class="alt" style="width:100%;margin-top:10px" onclick="dbr=true;tab='home';render()">تصفح المتاجر (View-Only)</button>`;
}
function walletHTML(){
 const l=db.led?.filter(x=>x.driver_id===me.id)||[];
 const sum=(k)=>l.reduce((a,x)=>a+(+x[k]||0),0);
 return `<div class="wgrid"><div class="wc"><span>💵</span><small>المحصّل</small><b>${fm(sum('collected'))}</b></div><div class="wc"><span>🏪</span><small>المدفوع</small><b>${fm(sum('paid'))}</b></div></div>`;
}
async function adv(id){
 const o=db.orders.find(x=>x.id===id);
 const next={accepted:'picked',picked:'delivered'}[o.status]||'delivered';
 await sb.from('orders').update({status:next}).eq('id',id);
 pull();
}

/* ================= STORE OWNER ================= */
function ownerView(){
 const l=db.stores.filter(s=>(db.mgrs||[]).some(m=>m.store_id===s.id && m.phone===me.phone));
 const s=l.find(x=>x.id===ocur)||l[0];
 if(!s)return `<div class="card">لا توجد متاجر مرتبطة بك.</div>`;
 return `<div class="card row"><b>${esc(s.name)}</b><button class="acc" onclick="cmode=true;tab='home';render()">وضع الزبون</button></div>`+oProd(s);
}

function oProd(s){
 const l=s.products;
 return `<button class="acc" style="width:100%;margin-bottom:10px" onclick="openPF()">إضافة منتج</button>`+
 l.map(p=>`<div class="card row"><span>${esc(p.name)} - ${fm(p.price)}</span><button class="alt sm" onclick="openPF('${p.id}')">تعديل</button></div>`).join('');
}

function openPF(id){
 const s=curStore(),p=id?s.products.find(x=>x.id===id):null;
 pfid=id||null;
 sheet(`<h2>${p?'تعديل':'إضافة'} منتج</h2>
 <input id="pf_name" placeholder="اسم السلعة" value="${p?esc(p.name):''}">
 <input id="pf_price" type="number" placeholder="السعر" value="${p?p.price:''}">
 <textarea id="pf_desc" placeholder="الوصف">${p&&p.descr?esc(p.descr):''}</textarea>
 <button class="acc" style="width:100%" onclick="savePF()">حفظ</button>`);
}
function curStore(){return db.stores.find(s=>(db.mgrs||[]).some(m=>m.store_id===s.id && m.phone===me.phone))}
async function savePF(){
 const n=$('pf_name').value.trim(),pr=+$('pf_price').value,desc=$('pf_desc').value.trim();
 if(!n||!pr)return;
 const s=curStore();
 const row={name:n,price:pr,descr:desc,store_id:s.id};
 if(pfid) await sb.from('products').update(row).eq('id',pfid);
 else await sb.from('products').insert(row);
 closeSheet(); pull();
}

/* ================= ADMIN & SUPER ADMIN ================= */
function adminPage(){
 const t=[['orders','الطلبات'],['ops','العمليات'],['report','التقرير'],['cur','العملة']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${n}</button>`).join('');
 let b='';
 if(tab==='orders')b=db.orders.map(o=>`<div class="card"><b>طلب #${o.id}</b><div>${o.status}</div></div>`).join('');
 else if(tab==='ops')b=opsView();
 else if(tab==='cur')b=curView();
 else b=reportView();
 return `<div class="tabs" style="margin-bottom:10px">${t}</div>`+b;
}

function opsView(){
 const c=st=>db.orders.filter(o=>o.status===st).length;
 return `<div class="kgrid"><div class="kp"><b>${c('new')}</b><small>جديدة</small></div><div class="kp"><b>${c('accepted')}</b><small>قيد التجهيز</small></div><div class="kp"><b>${c('picked')}</b><small>بالتوصيل</small></div></div>`;
}

function reportView(){
 return `<div class="card"><b>التقارير المالية والمبيعات</b></div>`;
}

function curView(){
 if(!me.sup)return `<div class="card">هذه الصفحة للمدير العام فقط.</div>`;
 return `<div class="card"><h3>إعداد العملة الشامل</h3>
 <select id="cu_c"><option value="TRY">ليرة تركي ₺</option><option value="USD">دولار $</option><option value="SYP">ليرة سورية ل.س</option></select>
 <input id="cu_u" type="number" step="any" placeholder="سعر الدولار مقابل التركي" value="${db.rates.USD}">
 <input id="cu_s" type="number" step="any" placeholder="سعر السورية مقابل التركي" value="${db.rates.SYP}">
 <button class="acc" style="width:100%" onclick="saveCur()">حفظ العملة</button></div>`;
}
async function saveCur(){
 await sb.from('settings').update({currency:$('cu_c').value,rates:{USD:+$('cu_u').value,SYP:+$('cu_s').value}}).eq('id',1);
 alert('تم الحفظ'); pull();
}

function sheet(h){const d=document.createElement('div');d.className='sheetov';d.innerHTML=`<div class="sheet">${h}</div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
function closeSheet(){document.querySelector('.sheetov')?.remove()}

function openTicket(){
 sheet(`<h2>إرسال شكوى</h2><textarea id="tk_m" placeholder="اكتب شكواك هنا..."></textarea><button class="acc" style="width:100%" onclick="sendTk()">إرسال</button>`);
}
async function sendTk(){
 const m=$('tk_m').value.trim();if(!m)return;
 await sb.from('tickets').update||sb.from('tickets').insert({message:m});
 closeSheet(); alert('تم إرسال الشكوى بنجاح');
}

pull();
</script>
</body>
</html>
