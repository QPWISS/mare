<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اتصل نصل - مارع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f2;--card:#fff;--ink:#16211b;--mut:#667269;--pri:#1f4d3a;--pi:#fff;--acc:#f2b51b;--line:#dfe5dc;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#18221b;--ink:#eaf0ea;--mut:#9aa89e;--pri:#4fa37c;--pi:#06150d;--line:#2a372e;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#101712;--card:#18221b;--ink:#eaf0ea;--mut:#9aa89e;--pri:#4fa37c;--pi:#06150d;--line:#2a372e;--bad:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:0 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
h1{font-size:22px;font-weight:800;margin:0;color:var(--pri)}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mut{color:var(--mut);font-size:14px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:var(--pri);color:var(--pi);cursor:pointer;text-decoration:none;display:inline-block}
button.alt,.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.acc{background:var(--acc);color:#2a2000}
button.sm{padding:4px 11px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:4px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--pri);color:var(--pi);border-color:var(--pri)}
.tag{font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc);color:#2a2000}
.tag.ok{background:var(--pri);color:var(--pi)}
.tag.off{background:var(--line);color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px}
.qty b{min-width:18px;text-align:center}
.bar{position:fixed;inset:auto 0 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--pri);color:var(--pi);display:flex;justify-content:space-between;align-items:center}
.bar button{background:var(--acc);color:#2a2000}
.alert{background:var(--acc);color:#2a2000;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.note{font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px;color:var(--mut)}
.store{border-inline-start:4px solid var(--pri);padding-inline-start:8px;margin:6px 0}
:root{--bg:#f2f5f6;--card:#fff;--ink:#12262c;--mut:#62767c;--pri:#0b3d4a;--pi:#fff;--acc:#ff7a1a;--line:#e1e8ea;--bad:#c62828;--sh:0 1px 2px rgba(11,61,74,.06),0 4px 14px rgba(11,61,74,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b171a;--card:#13262b;--ink:#e8f1f3;--mut:#93a9af;--pri:#3fb6c9;--pi:#04181c;--acc:#ff8a3a;--line:#22393f;--bad:#ff8a80;--sh:none}}
:root[data-theme="dark"]{--bg:#0b171a;--card:#13262b;--ink:#e8f1f3;--mut:#93a9af;--pri:#3fb6c9;--pi:#04181c;--acc:#ff8a3a;--line:#22393f;--bad:#ff8a80;--sh:none}
button.acc,.bar button,.tag,.alert{color:#2b1300}
.tag.ok{background:var(--pri);color:var(--pi)}
.tag.off{color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px}
.lg{width:44px;height:44px;border-radius:14px;background:var(--acc);display:grid;place-items:center;font-size:24px}
.lg.big{width:76px;height:76px;font-size:40px;margin:0 auto 10px;border-radius:24px}
.top h1{font-size:21px;line-height:1.1}
.sub{font-size:13px;color:var(--mut);font-weight:700}
.who{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap;justify-content:flex-end}
.who small{color:var(--mut)}
.auth{text-align:center;padding:30px 0 10px}
.auth h1{font-size:32px}
.card{border:0;box-shadow:var(--sh);border-radius:16px;padding:14px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tabs button{flex:1;border:0;box-shadow:var(--sh);padding:10px 12px}
.tabs button.on{background:var(--pri);color:var(--pi)}
.hero{background:var(--pri);color:var(--pi);border-radius:18px;padding:18px;margin:10px 0;display:flex;flex-direction:column;gap:4px}
.hero b{font-size:20px}
.hero span{opacity:.85;font-size:14px}
.sh{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:12px;background:var(--pri);color:var(--pi);display:grid;place-items:center;font-weight:800}
.prow{padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.qty button{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.steps{display:flex;gap:4px;margin:8px 0}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.d{background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--mut)}
.stats b{display:block;font-size:26px;color:var(--ink)}
.card.st-new{border-inline-start:5px solid var(--acc)}
.card.st-delivered{opacity:.75}
.bar{border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
#app{padding-bottom:150px}
.nav{position:fixed;inset:auto 0 0 0;z-index:10;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;font-size:21px;line-height:1.3;padding:4px 6px;border-radius:12px}
.nav button small{font-size:12px;font-weight:700}
.nav button.on{color:var(--pri);background:var(--bg)}
.bar{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:10px;margin:0 10px;border-radius:16px}

:root{--bg:#f5f8f8;--pri:#0d5677;--acc:#ff9a1a;--line:#dce8ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pri:#4bb4d6;--acc:#ffa52e}}
:root[data-theme="dark"]{--pri:#4bb4d6;--acc:#ffa52e}
button.acc,.bar button,.tag,.alert{color:#2b1b05}
.lgm{height:48px;width:48px;object-fit:contain;border-radius:13px}
.lgf{width:min(240px,66%);display:block;margin:0 auto}
.deliv{font-size:14px;color:var(--mut);margin:2px 0}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:16px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px}
.cat span{font-size:34px;line-height:1.2}
.scard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--ink);box-shadow:var(--sh);border-radius:16px;padding:12px;margin:8px 0;text-align:start;font-weight:400}
.scard>div{flex:1}
.av.big{width:52px;height:52px;border-radius:16px;font-size:28px;background:var(--bg)}
.sthead{text-align:center;margin:8px 0}
.sthead .av{margin:8px auto}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px}
.info small{display:block;color:var(--mut);font-size:12px}
.gtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;border-bottom:1px solid var(--line)}
.gtabs button{background:none;color:var(--mut);padding:8px 14px;border-radius:0}
.gtabs button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--pri)}
.pimg{width:56px;height:56px;border-radius:12px;object-fit:cover;margin-inline-end:10px}
img.av{object-fit:cover}
textarea{min-height:90px}
</style>
</head>

  const users=d?d.data.map(u=>({id:u.id,name:u.name,phone:u.phone,role:'driver'})):[];
  if(me.role==='admin')orders.forEach(x=>{const b=prev[x.id];if(b&&b!==x.status&&['picked','delivered'].includes(x.status))note((users.find(u=>u.id===x.driver)||{}).name+': '+(x.status==='picked'?'استلم الطلب':'سلّم الطلب')+' (طلب #'+x.id+')')});

async function auth(){
 const e=$('err'),ph=nph($('ph').value),pw=$('pw').value;
 if(!/^\d{9,15}$/.test(ph))return e.textContent='أدخل رقم واتساب صحيحاً';
 if(pw.length<6)return e.textContent='كلمة السر 6 أحرف أو أرقام على الأقل';
 e.textContent='جارٍ التحقق...';
 try{let r;
  if(mode==='reg'){const nm=$('nm').value.trim();if(!nm)return e.textContent='أدخل اسمك';
   r=await sb.auth.signUp({email:emailOf(ph),password:pw,options:{data:{phone:ph,name:nm}}});
   if(r.error)return e.textContent=/registered|exists/i.test(r.error.message)?'هذا الرقم مسجّل مسبقاً، يرجى تسجيل الدخول':'تعذّر إنشاء الحساب ('+r.error.message+')';
   if(!r.data.session)return e.textContent='لم يكتمل التسجيل، يرجى المحاولة لاحقاً';
  }else{r=await sb.auth.signInWithPassword({email:emailOf(ph),password:pw});if(r.error)return e.textContent='الرقم أو كلمة السر غير صحيحة'}
  await enter(r.data.user);
 }catch(x){console.error(x);e.textContent='تعذّر الاتصال، حاول مرة أخرى'}
}

async function upImg(file){const b=await createImageBitmap(file),k=Math.min(1,640/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/webp',.8)),ext=blob.type==='image/webp'?'webp':'png',path=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
 const r=await sb.storage.from('images').upload(path,blob,{contentType:blob.type});if(r.error)throw r.error;return sb.storage.from('images').getPublicUrl(path).data.publicUrl}
