.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.dbadge{position:absolute;top:6px;inset-inline-start:6px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:2px 8px;border-radius:99px;z-index:1}
.pci{position:relative}
.offer{background:#fff1e0;color:#7a3300;border-radius:12px;padding:10px 12px;font-weight:700;margin:6px 0}
.mbox{border:1px dashed var(--pri);border-radius:12px;padding:10px;margin:8px 0}
.ohead{display:flex;align-items:center;gap:10px}
:root{--bg:#F5F5DC;--card:#fff;--ink:#003366;--mut:#333333;--pri:#003366;--pi:#fff;--acc:#3399FF;--acc-d:#1f7fe0;--line:#e4e0c4;--bad:#c0392b;--sh:0 2px 10px rgba(0,51,102,.08)}
html,body{background:#e9e7c9;font-family:'Cairo','DejaVu Sans',Tahoma,sans-serif;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button,.btn{background:var(--acc);color:#002244;font-weight:700}
button.alt,.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.acc,.btn.acc,.bar button{background:var(--acc);color:#002244;box-shadow:0 4px 12px rgba(51,153,255,.3)}
.qty button,.qty button.alt{background:var(--pri);color:#fff;border:2px solid var(--acc)}
.tabs button.on{background:var(--pri);color:#fff}
.tag{background:#dcecff;color:#003366}
.tag.ok{background:var(--pri);color:#fff}
.tag.off{background:#ece9d2;color:#333}
.tag.s-new{background:#f1e6b8;color:#5b4700}
.tag.s-accepted,.tag.s-assigned,.tag.s-picked{background:#cfe5ff;color:#003366}
.tag.s-delivered{background:#d6efdc;color:#14612f}
.tag.s-cancelled{background:#f6d8d4;color:#8a2a20}
.hero,.alert,.offer{background:#dcecff;color:#003366}
.dbadge,.stg2{background:var(--pri);color:#fff}
.pill{background:var(--acc);color:#002244}
.simg.noimg{background:linear-gradient(135deg,#003366,#1b5f9e)}
.stp .cur i{background:var(--acc);border-color:var(--acc)}
.nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc);background:none}
.tabs2 button.on,.gtabs button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--acc)}
.top .sbar{border:2px solid var(--acc)}
.pp{color:#333}
.card{border:1px solid #efecd2}
.card.st-new{border-inline-start:5px solid var(--acc)}
.stats div.s1{background:#eaf3ff}.stats div.s2{background:#e4f6e4}.stats div.s3{background:#fbf0d4}
.ctile{color:#003366}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kp{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.kp span{font-size:22px;display:block}.kp b{font-size:17px;display:block;color:var(--pri)}.kp small{font-size:11px;color:#333}
.kp.kw{background:#eaf3ff}.kp.kb{background:#fbe3df}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.wc{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}
.wc span{font-size:22px}.wc small{display:block;color:#333;font-size:12px}.wc b{font-size:19px;color:var(--pri)}
.wc.hl{background:var(--pri)}.wc.hl b,.wc.hl small{color:#fff}
.mgrid{display:grid;gap:10px}
.mitem{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:start;width:100%;font-weight:400}
.mitem span{font-size:28px}.mitem small{display:block;color:#333}
.bk2{background:rgba(255,255,255,.2);color:#fff;padding:6px 12px}
.top.ttl .bk2{position:absolute;left:14px;top:calc(max(env(safe-area-inset-top,20px),20px) + 4px)}
</style>
