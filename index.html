.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.dbadge{position:absolute;top:6px;inset-inline-start:6px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:2px 8px;border-radius:99px;z-index:1}
.pci{position:relative}
.offer{background:#fff1e0;color:#7a3300;border-radius:12px;padding:10px 12px;font-weight:700;margin:6px 0}
.mbox{border:1px dashed var(--pri);border-radius:12px;padding:10px;margin:8px 0}
.ohead{display:flex;align-items:center;gap:10px}
:root{--bg:#F5F5DC;--card:#fff;--ink:#003366;--mut:#333333;--pri:#003366;--pi:#fff;--acc:#3399FF;--acc-d:#1f7fe0;--line:#e4e0c4;--bad:#c0392b;--sh:0 2px 10px rgba(0,51,102,.08)}
html,body{background:#e9e7c9;font-family:'Cairo','DejaVu Sans',Tahoma,sans-serif;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button,.btn{background:var(--acc);color:#002244;font-weight:700}
button.alt,.btn.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.acc,.btn.acc,.bar button{background:var(--acc);color:#002244;box-shadow:0 4px 12px rgba(51,153,255,.3)}
.qty button,.qty button.alt{background:var(--pri);color:#fff;border:2px solid var(--acc)}
.tabs button.on{background:var(--pri);color:#fff}
.tag{background:#dcecff;color:#003366}
.tag.ok{background:var(--pri);color:#fff}
.tag.off{background:#ece9d2;color:#333}
.tag.s-new{background:#f1e6b8;color:#5b4700}
.tag.s-accepted,.tag.s-assigned,.tag.s-picked{background:#cfe5ff;color:#003366}
.tag.s-delivered{background:#d6efdc;color:#14612f}
.tag.s-cancelled{background:#f6d8d4;color:#8a2a20}
.hero,.alert,.offer{background:#dcecff;color:#003366}
.dbadge,.stg2{background:var(--pri);color:#fff}
.pill{background:var(--acc);color:#002244}
.simg.noimg{background:linear-gradient(135deg,#003366,#1b5f9e)}
.stp .cur i{background:var(--acc);border-color:var(--acc)}
.nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--acc);background:none}
.tabs2 button.on,.gtabs button.on{color:var(--pri);box-shadow:inset 0 -3px 0 var(--acc)}
.top .sbar{border:2px solid var(--acc)}
.pp{color:#333}
.card{border:1px solid #efecd2}
.card.st-new{border-inline-start:5px solid var(--acc)}
.stats div.s1{background:#eaf3ff}.stats div.s2{background:#e4f6e4}.stats div.s3{background:#fbf0d4}
.ctile{color:#003366}
.kgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kp{background:#fff;border-radius:16px;padding:10px 4px;text-align:center;box-shadow:var(--sh)}
.kp span{font-size:22px;display:block}.kp b{font-size:17px;display:block;color:var(--pri)}.kp small{font-size:11px;color:#333}
.kp.kw{background:#eaf3ff}.kp.kb{background:#fbe3df}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.wc{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}
.wc span{font-size:22px}.wc small{display:block;color:#333;font-size:12px}.wc b{font-size:19px;color:var(--pri)}
.wc.hl{background:var(--pri)}.wc.hl b,.wc.hl small{color:#fff}
.mgrid{display:grid;gap:10px}
.mitem{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border-radius:16px;padding:14px;box-shadow:var(--sh);text-align:start;width:100%;font-weight:400}
.mitem span{font-size:28px}.mitem small{display:block;color:#333}
.bk2{background:rgba(255,255,255,.2);color:#fff;padding:6px 12px}
.top.ttl .bk2{position:absolute;left:14px;top:calc(max(env(safe-area-inset-top,20px),20px) + 4px)}
.cimg{width:48px;height:48px;border-radius:14px;object-fit:cover}
.bigic{font-size:44px;line-height:1.2}.bigic .cimg{width:76px;height:76px}
.ctile .cimg{width:52px;height:52px}
.pay{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer;font-weight:700}
.pay.sel{border-color:var(--pri);background:#eaf3ff}
.pay input{width:auto;margin:0}
.qr{width:min(260px,80%);display:block;margin:10px auto;border-radius:16px;background:#fff}
.code{direction:ltr;text-align:center;font-family:monospace;font-size:15px;word-break:break-all;background:#f1efe0;border-radius:10px;padding:10px;margin:8px 0;user-select:all}
.amt{text-align:center;font-size:30px;font-weight:800;color:var(--pri);margin:8px 0}
.payok{background:#d6efdc;color:#14612f}
.payb{background:#eaf3ff;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px}
.payb.submitted{background:#fff3cd}.payb.paid{background:#d6efdc}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#003366;color:#fff;padding:10px 18px;border-radius:99px;z-index:200;font-weight:700}

.splash{min-height:100vh;display:grid;place-content:center;gap:12px;text-align:center;color:#003366;font-size:18px}
.spin{width:38px;height:38px;border:4px solid #dcecff;border-top-color:#3399FF;border-radius:50%;margin:0 auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#app.pg>*{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctile.hasimg{background-size:cover;background-position:center;position:relative;overflow:hidden;padding:0;justify-content:flex-end;min-height:104px}
.ctile.hasimg .lbl{position:absolute;inset:auto 0 0 0;padding:20px 6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:13px;font-weight:800}
.catcover{height:130px;border-radius:18px;background-size:cover;background-position:center;position:relative;overflow:hidden;margin:4px 0 10px}
.catcover b{position:absolute;inset:auto 0 0 0;padding:26px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:20px}
.nav button{position:relative}
.bdg{position:absolute;top:2px;inset-inline-end:16%;background:#c0392b;color:#fff;border-radius:99px;font-size:11px;font-style:normal;padding:0 6px;font-weight:800}
.oc-act{display:flex;gap:8px;margin-top:8px}
.oc-act>button{flex:1}
.oc-sec{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.srow{display:flex;gap:10px;align-items:center}
.tabs2.scroll{overflow-x:auto;white-space:nowrap;display:flex}
.tabs2.scroll button{flex:0 0 auto}
@keyframes fi{from{opacity:0}to{opacity:1}}
#app.pg>*:not(.nav):not(.bar){animation:fi .2s ease}
#app.pg>.nav,#app.pg>.bar{animation:none}
.nav{left:0;right:0;margin-inline:auto;transform:none}
.bar{left:0;right:0;margin:0 auto;transform:none;width:calc(100% - 24px)}

return `<div class="auth"><img class="ban" src="${BANNER}" alt="اتصل نصل - مارع"></div>
<div class="card"><div class="tabs"><button class="${reg?'':'on'}" onclick="mode='login';render()">دخول</button><button class="${reg?'on':''}" onclick="mode='reg';render()">حساب جديد</button></div>

${reg?'<label>الاسم</label><input id="nm">':''}

<button onclick="auth()" style="width:100%">${reg?'إنشاء الحساب':'دخول'}</button><div id="err" class="mut" style="color:var(--bad);margin-top:6px"></div></div>
`}
function auth(){const ph=$('ph').value.trim().replace(/\s/g,''),pw=$('pw').value,e=$('err');
if(!/^\+?\d{9,15}$/.test(ph))return e.textContent='أدخل رقم واتساب صحيحاً';
if(!pw)return e.textContent='أدخل كلمة السر';
if(mode==='reg'){const nm=$('nm').value.trim();if(!nm)return e.textContent='أدخل اسمك';
if(db.users.some(u=>u.phone===ph))return e.textContent='هذا الرقم مسجّل مسبقاً، يرجى تسجيل الدخول';
me={phone:ph,name:nm,pass:pw,role:'customer'};db.users.push(me);save()}
else{const u=db.users.find(u=>u.phone===ph&&u.pass===pw);if(!u)return e.textContent='الرقم أو كلمة السر غير صحيحة';me=u}
tab=me.role==='admin'?'orders':me.role==='driver'?'jobs':me.role==='owner'?'oord':'home';render()}

/* ---------- customer ---------- */
function find(pid){for(const s of db.stores){const p=s.products.find(p=>p.id===pid);if(p)return{s,p}}}
function qd(pid,d){const f=find(pid);if(f&&f.p.stock!=null&&d>0&&(cart[pid]||0)>=f.p.stock)return alert('الكمية المتوفرة من هذا المنتج: '+f.p.stock+' فقط');cart[pid]=Math.max(0,(cart[pid]||0)+d);if(!cart[pid])delete cart[pid];render()}
const cartCount=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const cartSum=()=>Object.entries(cart).reduce((a,[id,q])=>{const f=find(id);return a+(f?f.p.price*q:0)},0);

+`<div class="card"><div class="row"><b>📍 موقع التوصيل</b>${loc?'<span class="tag ok">محدد</span>':'<span class="tag">غير محدد</span>'}</div><button class="alt" style="width:100%;margin:8px 0" onclick="openMap(false)">${loc?'🔄 تحديث موقعي الحالي (GPS)':'📍 حدد موقعي الحالي'}</button><input id="place" value="${esc(place)}" oninput="place=this.value" placeholder="وصف إضافي للمكان (اختياري)"></div>`
+`${payChooser()}<div class="card sumc"><div class="row"><span>المجموع الفرعي</span><span>${fm(cartSum())}</span></div><div class="row"><span>رسوم التوصيل</span><span>${fm(db.fee)}</span></div><div class="row tot"><b>المجموع الكلي</b><b>${fm(cartSum()+db.fee)}</b></div></div>`

if(tab==='acct')b=acctView();if(tab==='ord')b=ordView();
const bar=['home','store','search'].includes(tab)&&cartCount()?`<div class="bar"><span>${cartCount()} منتج · ${fm(cartSum())}</span><button onclick="setTab('cart')">سلّتي</button></div>`:'';
return (isV()?vnav():t)+b+bar}
function send(){const items=Object.entries(cart).map(([id,q])=>{const f=find(id);return f&&{sid:f.s.id,pid:id,name:f.p.name,price:f.p.price,q}}).filter(Boolean);if(!items.length)return;
const o={id:db.seq++,cust:me.phone,custName:me.name,place:place.trim(),loc,items,fee:db.fee,status:'new',driver:'',t:Date.now()};
db.orders.push(o);save();cart={};loc=null;place='';tab='mine';render()}

${s.products.map(p=>`<div class="row prow" style="flex-wrap:wrap"><span>${esc(p.name)} · ${fm(p.price)}${p.stock!=null?' · 📦 '+p.stock:''}</span><span style="display:flex;gap:6px;flex-wrap:wrap"><label class="btn alt sm">📷<input type="file" accept="image/*" hidden onchange="setProdImg('${p.id}',this)"></label><button class="alt sm" onclick="editProd('${p.id}')">تعديل</button><button class="alt sm" onclick="togProd('${p.id}')">${p.on?'إخفاء':'إظهار'}</button><button class="alt sm" style="color:var(--bad);border-color:var(--bad)" onclick="delProd('${p.id}')">حذف</button></span></div>`).join('')}</div>`).join('')+

b=`<div class="card"><div class="row"><b>طلبات اليوم المُسلَّمة</b><b>${d.length}</b></div><div class="row"><span>رسوم التوصيل</span><span>${fm(d.reduce((a,o)=>a+o.fee,0))}</span></div></div>

function seen(id){const n=db.notes.find(n=>n.id===id);if(n)n.seen=true;save();render()}
function assign(id,ph){if(!ph)return;const o=db.orders.find(o=>o.id===id);o.driver=ph;if(o.status==='accepted')o.status='assigned';save();render()}
function acc(id){db.orders.find(o=>o.id===id).status='accepted';save();render()}
function rej(id){if(!confirm('هل تريد رفض هذا الطلب؟'))return;db.orders.find(o=>o.id===id).status='cancelled';save();render()}
function togStore(id){const s=db.stores.find(s=>s.id===id);s.open=!s.open;save();render()}
function togProd(id){const f=find(id);f.p.on=!f.p.on;save();render()}
function addStore(){const n=$('sn').value.trim();if(!n)return;db.stores.push({id:'s'+Date.now(),name:n,phone:$('sp').value.trim(),cat:$('sc').value,open:true,products:[]});save();render()}
function addProd(){const n=$('pn').value.trim(),p=+$('pp').value;if(!n||!p)return;db.stores.find(s=>s.id===$('ps').value).products.push({id:'p'+Date.now(),name:n,price:p,g:$('pg').value.trim()||'المنتجات',on:true});save();render()}
function addDrv(){const n=$('dn').value.trim(),p=$('dp').value.trim(),w=$('dw').value;if(!n||!p||!w||db.users.some(u=>u.phone===p))return;db.users.push({phone:p,name:n,pass:w,role:'driver'});save();render()}

async function savePF(){const n=$('pf_name').value.trim(),pr=$('pf_price').value,d=Math.min(95,Math.max(0,+$('pf_disc').value||0)),o=+pr;
 if(!n||pr===''||!(o>=0))return alert('أدخل اسم المنتج وسعره');
 let price=d>0?Math.round(o*(1-d/100)*100)/100:o,old=d>0?o:null;
 if(pfp&&o===(pfp.old||pfp.price)&&d===pfd){price=pfp.price;old=pfp.old||null}
 let g=$('pf_grp').value;if(g==='__new')g=($('pf_newg').value||'').trim()||'المنتجات';
 const s=curStore(),f=$('pf_img').files[0];let u=null;if(f){try{u=await upImg(f)}catch(e){return fail(e)}}
 const row={name:n,price,old_price:old,grp:g,descr:($('pf_desc').value||'').trim()||null};if(u)row.image_url=u;
 const r=pfid?await sb.from('products').update(row).eq('id',pfid):await sb.from('products').insert({...row,store_id:s.id});
 if(r.error)return fail(r.error);
 const names=ogroups(s).map(x=>x.name);if(!names.includes(g)){names.push(g);await sb.from('store_groups').upsert(names.map((nm,i)=>({store_id:s.id,name:nm,pos:i})),{onConflict:'store_id,name'})}
 closeSheet();await pull();render()}
async function delPF(id){if(!confirm('حذف هذا المنتج نهائياً؟'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return fail(r.error);closeSheet();await pull();render()}
function openPaste(){const s=curStore(),gs=ogroups(s).map(x=>x.name);sheet(`<h2 style="margin-top:0">لصق قائمة أسعار</h2><p class="mut">كل منتج في سطر بالشكل: الاسم - السعر. المنتج الموجود بنفس الاسم يتحدّث سعره، والجديد يُضاف.</p><textarea id="pst" rows="7" placeholder="شاورما دجاج - 150&#10;فروج مشوي - 700"></textarea><select id="pst_g">${(gs.length?gs:['المنتجات']).map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</select><div class="row" style="gap:8px"><button class="acc big" style="flex:1" onclick="doPaste()">تنفيذ</button><button class="alt big" onclick="closeSheet()">إلغاء</button></div>`)}
async function doPaste(){const s=curStore(),g=$('pst_g').value,rows=$('pst').value.split('\n').map(l=>l.match(/^(.+?)\s*[-–:،,]\s*([\d.]+)\s*$/)).filter(Boolean).map(m=>({name:m[1].trim(),price:+m[2]}));
 if(!rows.length)return alert('اكتب كل منتج في سطر بالشكل: الاسم - السعر');
 const ex={};s.products.forEach(p=>{ex[p.name.trim()]=p});const ups=[],ins=[];
 rows.forEach(r=>{const p=ex[r.name];if(p)ups.push(sb.from('products').update({price:r.price,old_price:null}).eq('id',p.id));else ins.push({store_id:s.id,name:r.name,price:r.price,grp:g})});
 const res=await Promise.all(ups);if(ins.length)res.push(await sb.from('products').insert(ins));
 const bad=res.find(x=>x.error);if(bad)return fail(bad.error);closeSheet();alert('تم: '+ups.length+' تحديث، '+ins.length+' إضافة');await pull();render()}
function pctAll(){const s=curStore(),v=prompt('اكتب نسبة التغيير على كل الأسعار (مثال: 5 للزيادة، -10 للتخفيض)');if(v===null||v===''||isNaN(+v))return;const k=1+(+v)/100;if(k<=0||!confirm('تغيير كل أسعار «'+s.name+'» بنسبة '+v+'%؟'))return;
 Promise.all(s.products.map(p=>sb.from('products').update({price:Math.round(p.price*k*100)/100,old_price:p.old?Math.round(p.old*k*100)/100:null}).eq('id',p.id))).then(async()=>{await pull();render()})}
function oGrp(s){const gs=ogroups(s);
 return `<h2>الأقسام</h2><p class="mut">الأقسام تنظّم منتجاتك أمام الزبون (مثل: وجبات، ساندويش، فروج، مناسف).</p>`+(gs.map((g,i)=>`<div class="card row"><div><b>${esc(g.name)}</b><div class="mut" style="font-size:12px">${g.count} منتج</div></div><span style="display:flex;gap:6px"><button class="alt sm" onclick="moveG(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="alt sm" onclick="moveG(${i},1)" ${i===gs.length-1?'disabled':''}>↓</button><button class="alt sm" onclick="renG(${i})">✏️</button><button class="alt sm" style="color:var(--bad);border-color:var(--bad)" onclick="delG(${i})">🗑</button></span></div>`).join('')||'<div class="empty"><span>📂</span><b>لا توجد أقسام بعد</b></div>')+`<div class="card"><input id="ng" placeholder="اسم القسم الجديد"><button class="acc" style="width:100%" onclick="addG()">➕ إضافة قسم</button></div>`}
async function saveOrder(s,names){const u=[...new Set(names)],r=await sb.from('store_groups').upsert(u.map((n,i)=>({store_id:s.id,name:n,pos:i})),{onConflict:'store_id,name'});if(r.error)return fail(r.error);await pull();render()}
function moveG(i,d){const s=curStore(),names=ogroups(s).map(x=>x.name),j=i+d;if(j<0||j>=names.length)return;[names[i],names[j]]=[names[j],names[i]];saveOrder(s,names)}
function addG(){const s=curStore(),n=$('ng').value.trim();if(!n)return;const names=ogroups(s).map(x=>x.name);if(names.includes(n))return alert('هذا القسم موجود');names.push(n);saveOrder(s,names)}
async function renG(i){const s=curStore(),gs=ogroups(s).map(x=>x.name),n=gs[i],v=prompt('الاسم الجديد للقسم',n);if(!v||!v.trim()||v.trim()===n)return;const nn=v.trim();
 const r=await sb.from('products').update({grp:nn}).eq('store_id',s.id).eq('grp',n);if(r.error)return fail(r.error);
 await sb.from('store_groups').delete().eq('store_id',s.id).eq('name',n);gs[i]=nn;saveOrder(s,gs)}
async function delG(i){const s=curStore(),n=ogroups(s)[i].name,c=s.products.filter(p=>(p.g||'المنتجات')===n).length;
 if(!confirm(c?'سيُنقل منتجات هذا القسم ('+c+') إلى قسم «المنتجات». متابعة؟':'حذف القسم؟'))return;
 if(c){const r=await sb.from('products').update({grp:'المنتجات'}).eq('store_id',s.id).eq('grp',n);if(r.error)return fail(r.error)}
 const r2=await sb.from('store_groups').delete().eq('store_id',s.id).eq('name',n);if(r2.error)return fail(r2.error);await pull();render()}
function oOff(s){const al=s.products.filter(p=>p.old&&p.old>p.price);
 return `<h2>رسالة عرض للمتجر</h2><div class="card"><div class="mut">تظهر أعلى صفحة متجرك للزبائن.</div><input id="of_t" value="${esc(s.offer||'')}" placeholder="مثال: توصيل مجاني على كل الوجبات اليوم"><button class="acc" style="width:100%" onclick="saveOffer()">حفظ الرسالة</button></div><h2>خصم على منتج</h2><div class="card"><select id="dp_sel">${s.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${fm(p.old||p.price)}</option>`).join('')}</select><input id="dp_pct" type="number" inputmode="numeric" placeholder="نسبة الخصم %"><button class="acc" style="width:100%" onclick="applyDisc()">تطبيق الخصم</button></div><h2>الخصومات الحالية</h2>`
 +(al.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><div>${fm(p.price)} <s class="mut">${fm(p.old)}</s> <span class="tag">-${Math.round((1-p.price/p.old)*100)}%</span></div></div><button class="alt sm" onclick="removeDisc('${p.id}')">إلغاء</button></div>`).join('')||'<div class="card mut">لا توجد خصومات.</div>')+(al.length?`<button class="alt" style="width:100%" onclick="clearDiscs()">إلغاء كل الخصومات</button>`:'')}
function saveOffer(){const s=curStore();act(sb.from('stores').update({offer_text:$('of_t').value.trim()||null}).eq('id',s.id))}
function applyDisc(){const id=$('dp_sel').value,d=Math.min(95,Math.max(0,+$('dp_pct').value||0));if(!id||d<1)return alert('اختر المنتج وأدخل نسبة الخصم');const p=find(id).p,orig=p.old||p.price;act(sb.from('products').update({price:Math.round(orig*(1-d/100)*100)/100,old_price:orig}).eq('id',id))}
function removeDisc(id){const p=find(id).p;act(sb.from('products').update({price:p.old,old_price:null}).eq('id',id))}
function clearDiscs(){const s=curStore(),l=s.products.filter(p=>p.old);if(!l.length||!confirm('إلغاء كل الخصومات؟'))return;Promise.all(l.map(p=>sb.from('products').update({price:p.old,old_price:null}).eq('id',p.id))).then(async()=>{await pull();render()})}
function oSet(s){return `<h2>صورة المتجر</h2><div class="card">${s.image_url?`<img loading="lazy" decoding="async" src="${esc(s.image_url)}" alt="" style="width:100%;border-radius:12px;margin-bottom:8px">`:''}<label class="btn alt" style="display:block;text-align:center">📷 ${s.image_url?'تغيير الصورة':'إضافة صورة'}<input type="file" accept="image/*" hidden onchange="setStoreImg('${s.id}',this)"></label></div><h2>ساعات الدوام</h2><div class="card"><div class="mut">يفتح المتجر ويغلق تلقائياً في هذه الساعات. اتركها فارغة للتحكم اليدوي فقط.</div>${hoursEditor(s)}</div>`}

 return `<div class="card oc st-${o.status}${isLate(o)?' late':''}"><div class="row"><b>#${o.id}</b><span class="tag s-${o.status}">${STATUS[o.status]}</span><span class="mut" style="font-size:12px;margin-inline-start:auto">${ago(o.t)}</span></div>${lateTag(o)}<div style="margin:4px 0"><a href="#" class="lnk" onclick="openCust('${o.cid}');return false">${esc(o.custName)}</a> <span class="mut" dir="ltr">${esc(o.cust)}</span>${o.place?`<div class="mut" style="font-size:13px">📍 ${esc(o.place)}</div>`:''}</div>${Object.entries(g).map(([k,l])=>`<div class="store"><b>${esc(sname(k))}</b> <span class="mut">${l.map(i=>esc(i.name)+' × '+i.q).join('، ')}</span></div>`).join('')}<div class="row" style="margin-top:6px"><span class="mut">${fm(sub(o))} + توصيل ${fm(o.fee)}</span><b>${fm(oTot(o))}</b></div>${payBox(o)}${o.driver?`<div class="mut" style="margin-top:4px">🛵 ${esc(dr.name||'')}</div>`:''}${(acts.length&&!fin)?`<div class="oc-act">${acts.join('')}</div>`:''}<div class="oc-sec">${sec}</div></div>`}
function ordersPage(){
 const un=db.notes.filter(n=>!n.seen),O=db.orders.slice().reverse(),live=O.filter(o=>!['delivered','cancelled'].includes(o.status)),fin=O.filter(o=>['delivered','cancelled'].includes(o.status)).slice(0,20),
 ch=[['act','الجارية ('+live.length+')'],['done','المنتهية']].map(([k,n])=>`<button class="${ofl===k?'':'alt'} sm" onclick="ofl='${k}';render()">${n}</button>`).join('');
 return statBar()+un.map(n=>`<div class="alert row"><span>${esc(n.t)}</span><button class="sm" onclick="seen(${n.id})">تم</button></div>`).join('')+`<div class="row" style="gap:6px;justify-content:flex-start;margin:8px 0">${ch}</div>`+((ofl==='act'?live:fin).map(ordCard).join('')||'<div class="card mut">لا توجد طلبات.</div>')}
/* admin: stores */
function storesPage(){return `<div class="row"><h2 style="margin:6px 0">المتاجر</h2><button class="acc sm" onclick="openNewStore()">➕ متجر جديد</button></div>`+(db.stores.map(s=>`<div class="card tap srow" onclick="openAStore('${s.id}')">${s.image_url?`<img class="pimg" loading="lazy" src="${esc(s.image_url)}" alt="">`:`<span class="av big">${catI(s.cat)[2]}</span>`}<div style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="mut" style="font-size:12px">${esc(catI(s.cat)[1])} · ${s.products.length} منتج</div></div><span class="tag ${s.open?'ok':'off'}">${s.open?'مفتوح':(s.man?'خارج الدوام':'مغلق')}</span></div>`).join('')||'<div class="empty"><span>🏪</span><b>لا توجد متاجر بعد</b></div>')}
function openNewStore(){sheet(`<h2 style="margin-top:0">متجر جديد</h2><input id="sn" placeholder="اسم المتجر"><select id="sc">${CATS.map(c=>`<option value="${c[0]}">${c[2]} ${esc(c[1])}</option>`).join('')}</select><input id="sp" type="tel" placeholder="رقم واتساب المتجر (اختياري)"><label class="mut">صورة المتجر (اختيارية)</label><input id="si" type="file" accept="image/*"><div class="row" style="gap:8px;margin-top:8px"><button class="acc big" style="flex:1" onclick="addStore()">إضافة</button><button class="alt big" onclick="closeSheet()">إلغاء</button></div>`)}
async function addStore(){const n=$('sn').value.trim();if(!n)return;const ph=$('sp').value.trim(),c=$('sc').value,f=$('si').files[0];let u=null;try{if(f)u=await upImg(f,1000)}catch(e){return fail(e)}closeSheet();act(sb.from('stores').insert({name:n,phone:ph,cat:c,image_url:u}))}
function openAStore(id){ast='prod';sid=id;go('astore',null,id)}
function aData(s){return `<div class="card"><div class="row"><span>الاسم</span><b>${esc(s.name)}</b></div><div class="row prow"><span>رقم واتساب المتجر</span><b dir="ltr">${esc(s.phone||'—')}</b></div><button class="alt" style="width:100%;margin-top:8px" onclick="editStore('${s.id}')">✏️ تعديل الاسم والرقم</button><label class="mut" style="display:block;margin-top:10px">القسم</label><select onchange="setStoreCat('${s.id}',this.value)">${CATS.map(c=>`<option value="${c[0]}" ${c[0]===s.cat?'selected':''}>${c[2]} ${esc(c[1])}</option>`).join('')}</select></div>${mgrBox(s)}<button class="alt big" style="width:100%;color:var(--bad);border-color:var(--bad);margin-top:10px" onclick="delStore('${s.id}')">🗑 حذف المتجر</button>`}
function astorePage(){const s=db.stores.find(x=>x.id===sid);if(!s)return storesPage();
 const T=[['prod','🍽️','المنتجات'],['grp','📂','الأقسام'],['off','🏷️','العروض'],['set','⚙️','الدوام والصورة'],['data','👤','البيانات والمسؤولون']],
 hd=`<div class="pghead"><button class="alt sm" onclick="back()">→</button><b>${esc(s.name)}</b><button class="${s.man?'':'alt'} sm" onclick="togStore('${s.id}')">${s.man?'🟢 مفتوح':'⚪ مغلق'}</button></div>`,
 tabs=`<div class="tabs2 scroll">${T.map(([k,i,n])=>`<button class="${ast===k?'on':''}" onclick="ast='${k}';render()">${i} ${n}</button>`).join('')}</div>`;
 return hd+tabs+({prod:oProd,grp:oGrp,off:oOff,set:oSet,data:aData}[ast])(s)}
/* admin: drivers, settings, admins, menu, nav, router */
function driversPage(){return `<div class="row"><h2 style="margin:6px 0">السائقون</h2><button class="acc sm" onclick="openNewDrv()">➕ إضافة سائق</button></div>`+(db.users.filter(u=>u.role==='driver').map(d=>{const st=drvState({shift:d.shift,load:dloadN(d.id)});return `<div class="card"><div class="row"><div><b>${esc(d.name)}</b><div class="mut" style="font-size:12px" dir="ltr">${esc(d.phone)}</div></div><span class="tag">${st.t}</span></div><div class="row" style="gap:6px;justify-content:flex-start;margin-top:8px"><button class="alt sm" onclick="editDrv('${d.id}')">✏️ تعديل الاسم</button><a class="btn alt sm" target="_blank" rel="noopener" href="${wa(d.phone,'مرحباً')}">💬 واتساب</a><button class="alt sm" style="color:var(--bad);border-color:var(--bad)" onclick="delDrv('${d.id}')">🗑 حذف</button></div></div>`}).join('')||'<div class="card mut">لا يوجد سائقون مسجّلون.</div>')+pendHTML()}
function openNewDrv(){sheet(`<h2 style="margin-top:0">إضافة سائق</h2><div class="mut" style="margin-bottom:6px">اكتب اسمه ورقمه. عندما يسجّل حساباً بهذا الرقم يصبح سائقاً تلقائياً.</div><input id="dn" placeholder="اسم السائق"><input id="dp" type="tel" placeholder="رقم هاتف السائق"><div class="row" style="gap:8px"><button class="acc big" style="flex:1" onclick="addDrv();closeSheet()">إضافة</button><button class="alt big" onclick="closeSheet()">إلغاء</button></div>`)}
function settingsPage(){return subHead('⚙️ الإعدادات العامة')+`<h2>رسوم التوصيل</h2><div class="card"><input id="fee" type="number" step="any" value="${db.fee}"><button class="acc" style="width:100%" onclick="setFee()">حفظ الرسوم</button></div><h2>لافتة العروض</h2><div class="card"><div class="mut">لا تظهر للزبائن إلا عندما تكتب عرضاً حقيقياً.</div><input id="bt" value="${esc(db.banner.t)}"><input id="bs" value="${esc(db.banner.s)}"><button class="acc" style="width:100%" onclick="setBanner()">حفظ اللافتة</button></div>${waAdmin()}${secsAdmin()}`}
function admPage(){return subHead('👑 المدراء')+adminsHTML()}
function morePage(){const o=(db.tix||[]).filter(t=>t.status==='open').length,it=(t,i,n,d)=>`<button class="mitem" onclick="setTab('${t}')"><span>${i}</span><div><b>${n}</b><small>${d}</small></div></button>`;
 return `<h2 style="margin-top:6px">المزيد</h2><div class="mgrid">${it('report','📊','التقرير والحسابات','المبيعات وتسوية السائقين')}${it('tix','🛟','الشكاوى والدعم',o?o+' شكوى مفتوحة':'لا توجد شكاوى مفتوحة')}${it('set','⚙️','الإعدادات العامة','رسوم التوصيل واللافتة وأرقام واتساب')}${it('cats','🗂️','أقسام التطبيق','إضافة وتعديل وحذف الأقسام')}${it('area','🧭','نطاق الخدمة','المنطقة المسموح الطلب منها')}${it('pay','💳','طرق الدفع','شام كاش والدفع عند الباب')}${it('cur','💱','العملة وأسعار الصرف','للمدير العام فقط')}${it('adm','👑','المدراء','إضافة وإزالة المدراء')}</div>`}
function adminNav(){const t=[['orders','🧾','الطلبات'],['stores','🏪','المحلات'],['drivers','🛵','السائقون'],[me.sup?'ops':'report',me.sup?'🛰️':'📊',me.sup?'العمليات':'التقرير'],['more','⋯','المزيد']],on=tab==='astore'?'stores':['tix','cats','area','pay','cur','set','adm'].includes(tab)?'more':tab;
 return `<div class="nav">${t.map(([k,i,n])=>`<button class="${on===k?'on':''}" onclick="setTab('${k}')">${i}<small>${n}</small></button>`).join('')}</div>`}
function adminPage(){if(tab==='cust')return custPage();
 const P={ops:opsView,more:morePage,tix:tixPage,cur:curPage,cats:catsPage,area:areaPage,pay:payPage,set:settingsPage,adm:admPage,orders:ordersPage,stores:storesPage,astore:astorePage,drivers:driversPage}[tab];
 if(P)return P()+adminNav();
 if(tab==='report'&&me.sup)return subHead('📊 التقرير والحسابات')+adminView();
 return adminView()}

loadCache();
(async()=>{
 try{const r=await sb.auth.getSession();if(r.data.session)await enter(r.data.session.user);else render()}catch(e){console.error(e);render()}
 let tick=0;setInterval(()=>{if(!me||document.hidden||pn>0)return;tick++;if(me.role!=='owner'&&tick%2)return;pull(tick%12===0)},5000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me&&pn===0)pull(true)});
 let rtT=null,rtF=false;const rtp=full=>{rtF=rtF||full;clearTimeout(rtT);rtT=setTimeout(()=>{const f=rtF;rtF=false;pull(f)},250)};
 ['orders','stores','products','profiles','tickets','driver_ledger','driver_settlements'].reduce((ch,t)=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>rtp(t!=='orders')),sb.channel('live-all')).subscribe();
})();
